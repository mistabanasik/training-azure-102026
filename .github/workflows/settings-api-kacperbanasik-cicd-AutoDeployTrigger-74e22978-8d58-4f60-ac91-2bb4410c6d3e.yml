name: Trigger auto deployment for settings-api-kacperbanasik-cicd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'nodejs-microservices/packages/settings-api/**'
    - '.github/workflows/settings-api-kacperbanasik-cicd-AutoDeployTrigger-74e22978-8d58-4f60-ac91-2bb4410c6d3e.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.SETTINGSAPIKACPERBANASIKCICD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.SETTINGSAPIKACPERBANASIKCICD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.SETTINGSAPIKACPERBANASIKCICD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: packages/settings-api/Dockerfile
          registryUrl: rejestrkb.azurecr.io
          registryUsername: ${{ secrets.GATEWAYAPIKACPERBANASIKCICD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAYAPIKACPERBANASIKCICD_REGISTRY_PASSWORD }}
          containerAppName: settings-api-kacperbanasik-cicd
          resourceGroup: szkolenie-rg
          imageToBuild: rejestrkb.azurecr.io/settings-api-kacperbanasik-cicd:${{ github.sha }}


