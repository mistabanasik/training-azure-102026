name: Trigger auto deployment for dice-api-kacperbanasik-cicd

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - 'nodejs-microservices/packages/dice-api/**'
    - '.github/workflows/dice-api-kacperbanasik-cicd-AutoDeployTrigger-9513890a-f4ea-4239-8087-f3a1e57904e5.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.DICEAPIKACPERBANASIKCICD_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.DICEAPIKACPERBANASIKCICD_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.DICEAPIKACPERBANASIKCICD_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/nodejs-microservices
          dockerfilePath: packages/dice-api/Dockerfile
          registryUrl: rejestrkb.azurecr.io
          registryUsername: ${{ secrets.GATEWAYAPIKACPERBANASIKCICD_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.GATEWAYAPIKACPERBANASIKCICD_REGISTRY_PASSWORD }}
          containerAppName: dice-api-kacperbanasik-cicd
          resourceGroup: szkolenie-rg
          imageToBuild: rejestrkb.azurecr.io/dice-api-kacperbanasik-cicd:${{ github.sha }}


